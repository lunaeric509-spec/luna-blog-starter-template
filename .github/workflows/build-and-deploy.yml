name: CI — Build and safe Deploy

# Runs builds on PRs and pushes to main. Deploys only on tag pushes (v*.*.*) or when manually triggered
# with the `deploy` input. The deploy job uses the `production` environment so you can require
# reviewers/approvals in repo settings (Settings → Environments → production).

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Set to 'true' to run the deploy job when manually dispatching this workflow."
        required: false
        default: 'false'

jobs:
  build:
    name: Install & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifacts (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: ./dist

  deploy:
    name: Deploy to Cloudflare (safe)
    runs-on: ubuntu-latest
    needs: build
    # Only run for tag pushes (refs/tags/*) OR when manually triggered with deploy=true
    if: >
      startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')

    # Use a protected environment so you can require manual approvals in repository settings.
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Ensure CF_API_TOKEN secret is set
        run: |
          if [ -z "${{ secrets.CF_API_TOKEN }}" ]; then
            echo "Error: CF_API_TOKEN is not set. Add it in repository settings → Secrets → Actions.";
            exit 1;
          fi

      - name: Publish with wrangler
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          # npx wrangler publish will read wrangler.json (or wrangler.toml)
          echo "Publishing to Cloudflare Workers..."
          npx wrangler publish --release

      - name: Optional smoke test
        run: |
          # Replace the URL below with your production site URL if known.
          SITE_URL="https://example.com"
          if [ "$SITE_URL" = "" ] || [ "$SITE_URL" = "https://example.com" ]; then
            echo "Skipping smoke test — set SITE_URL in this workflow if you want the check to run.";
            exit 0;
          fi
          status=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL" || true)
          if [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
            echo "Smoke test passed: $SITE_URL returned $status"
          else
            echo "Smoke test failed: $SITE_URL returned $status";
            exit 1
          fi
